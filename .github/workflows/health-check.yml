name: luxela.jp health check

on:
  schedule:
    - cron: "0 20 * * *" # 毎日 朝5:00 JST
    - cron: "0 8 * * *" # 毎日 夕方17:00 JST
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run health checks
        id: health_checks
        env:
          HEALTH_CHECK_BASE_URL: https://luxela.jp
          HEALTH_CHECK_CAST_EMAIL: ${{ secrets.HEALTH_CHECK_CAST_EMAIL }}
          HEALTH_CHECK_CAST_PASSWORD: ${{ secrets.HEALTH_CHECK_CAST_PASSWORD }}
          HEALTH_CHECK_PASSCODE: ${{ secrets.HEALTH_CHECK_PASSCODE }}
        run: npx playwright test

      - name: Upload report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: health-checks-report
          path: health-checks-report/
          retention-days: 1

      # 失敗時: Slackチャンネルへ直接通知。
      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \"🔴 luxela.jp ヘルスチェック失敗\n実行結果: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      # 失敗時: 既存のオープンなアラートIssueがあればコメント追記、無ければ新規作成。
      - name: Open/update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🔴 luxela.jp ヘルスチェック失敗";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `自動ヘルスチェックが失敗しました。\n\n実行結果: ${runUrl}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "health-check",
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["health-check"],
              });
            }

      # 成功時: オープンなアラートIssueが残っていれば復旧コメントを付けて自動クローズ。
      - name: Close recovered issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "health-check",
            });

            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "✅ 復旧を確認しました。ヘルスチェックが正常に成功しています。",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
